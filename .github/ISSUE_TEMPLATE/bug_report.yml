name: Bug report
description: Report a reproducible defect in BhriguSetu
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real birth details, private data, credentials, or tokens. Use synthetic examples."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic input data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: textarea
    id: logs
    attributes:
      label: Sanitised logs
      description: Remove names, birth details, coordinates, tokens and other personal data.
